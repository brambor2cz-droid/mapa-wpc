<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f5f7;
    color: #1f2933;
  }

  button,
  input,
  select {
    font-family: inherit;
  }

  button {
    cursor: pointer;
    border: 1px solid #c7ccd1;
    background: #ffffff;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    transition: 0.15s ease;
  }

  button:hover {
    background: #f0f4f8;
  }

  input,
  select {
    border: 1px solid #c7ccd1;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    min-height: 42px;
    background: #ffffff;
  }

  input:focus,
  select:focus {
    outline: none;
    border-color: #2e7d32;
    box-shadow: 0 0 0 3px rgba(46,125,50,0.14);
  }

  .admin-header,
  .controls,
  .map-search,
  .add-form {
    width: min(1400px, calc(100% - 32px));
    margin: 16px auto;
    border: 1px solid #d9dee3;
    border-radius: 14px;
    background: #ffffff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.04);
  }

  .admin-header {
    margin-top: 20px;
    padding: 20px;
    background: linear-gradient(135deg, #2e7d32, #5ca747);
    color: #ffffff;
    border: none;
  }

  .admin-header h1 {
    margin: 0 0 6px;
    font-size: 26px;
  }

  .admin-header p {
    margin: 0;
    opacity: 0.95;
  }

  .controls {
    padding: 16px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
  }

  .controls strong,
  .map-search strong,
  .type-options strong,
  .opening-hours-title strong {
    font-size: 16px;
  }

  .controls label,
  .type-options label,
  .opening-day label {
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .map-search {
    padding: 16px 20px;
    display: grid;
    grid-template-columns: auto minmax(260px, 420px) auto;
    gap: 12px;
    align-items: center;
    position: relative;
  }

  .map-search input {
    width: 100%;
  }

  .search-results {
    position: absolute;
    top: 60px;
    left: 150px;
    background: #ffffff;
    border: 1px solid #ccc;
    min-width: 320px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 10000;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    display: none;
    border-radius: 10px;
  }

  .search-result-item {
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid #eee;
  }

  .search-result-item:hover {
    background: #f4f4f4;
  }

  .search-result-item:last-child {
    border-bottom: none;
  }

  .add-form {
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(4, minmax(190px, 1fr));
    gap: 14px;
    align-items: start;
  }

  .add-form > input,
  .add-form > button,
  .add-form > .dropdown {
    width: 100%;
  }

  #adminMapPlaceAddress {
    grid-column: span 2;
  }

  #adminMapUseMapClickButton {
    white-space: normal;
  }

  .dropdown {
    position: relative;
    display: block;
  }

  .dropdown-button {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    background: white;
    border: 1px solid #c7ccd1;
    border-radius: 8px;
    cursor: pointer;
    min-width: unset;
    text-align: left;
    min-height: 42px;
  }

  .dropdown-content {
    display: none;
    position: absolute;
    background: white;
    width: min(420px, 90vw);
    max-height: 300px;
    overflow-y: auto;
    border: 1px solid #ccc;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    z-index: 9999;
    padding: 10px;
    border-radius: 10px;
  }

  .dropdown-content label {
    display: block;
    padding: 8px 6px;
    cursor: pointer;
    font-size: 14px;
  }

  .dropdown-content label:hover {
    background: #f4f7f9;
    border-radius: 6px;
  }

  .dropdown.open .dropdown-content {
    display: block;
  }

  .opening-hours {
    grid-column: 1 / -1;

    border: 1px solid #d9dee3;
    border-radius: 12px;
    padding: 16px;

  .opening-hours-title {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .opening-hours-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(280px, 1fr));
    gap: 12px;
  }

  .opening-day {
    display: grid;
    grid-template-columns: 90px 90px 18px 90px auto auto;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    border: 1px solid #d9dee3;
    border-radius: 10px;
    padding: 10px;
  }

  .opening-day strong {
    min-width: unset;
  }

  .opening-day select {
    min-width: unset;
    width: 100%;
  }

  .type-options {
    grid-column: 1 / -1;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: center;
    padding: 12px 0 4px;
    border-top: 1px solid #e5e9ed;
  }

  #adminMapAddPlaceButton {
    background: #2e7d32;
    color: #ffffff;
    border-color: #2e7d32;
    font-weight: 700;
  }

  #adminMapAddPlaceButton:hover {
    background: #256628;
  }

  #adminMapCancelEditButton {
    background: #fff5f5;
    color: #9b1c1c;
    border-color: #f0b4b4;

  #adminMapExportHtmlButton {
    background: #eef6ff;
    color: #0b5394;
    border-color: #b8d7f4;
  }

  .map-pin {
    position: relative;
    width: 44px;
    height: 58px;
  }

  .map-pin-shape {
    width: 44px;
    height: 44px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2px solid rgba(0,0,0,0.18);
    box-shadow: 0 3px 8px rgba(0,0,0,0.28);
    position: absolute;
    left: 0;
    top: 0;
    overflow: hidden;
  }

  .map-pin-shape::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--pin-background);
  }

  .map-pin-inner {
    position: absolute;
    left: 8px;
    top: 8px;
    width: 28px;
    height: 28px;
    background: white;
    border-radius: 50%;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(45deg);
    font-size: 15px;
    border: 1px solid rgba(0,0,0,0.15);
  }

  .map-pin-icons {
    line-height: 1;
    text-align: center;
    white-space: nowrap;
  }

  .map-pin-icons.two-icons {
    font-size: 12px;
    letter-spacing: -3px;
  }

  .map-pin-icons.three-icons {
    font-size: 10px;
    letter-spacing: -4px;
  }

  .pin-vzorkovna {
    --pin-background: #38b6a6;

  .pin-vydejni_misto {

  .pin-prodejce {

  }

  .pin-vzorkovna-prodejce {

  }

  .pin-vydejni_misto-prodejce {
    --pin-background: linear-gradient(90deg, #3b82d6 0 50%, #ff654d 50% 100%);
  }

  .pin-all-types {
    --pin-background: #45525c;
  }

  .admin-map-modal-overlay {
    display: none;

    inset: 0;

  async function loadPlacesFromSupabase() {
    const { data, error } = await supabaseClient
      .from('map_places')
      .select('*')
      .order('created_at', { ascending: true });

    if (error) {
      alert('Nepodařilo se načíst body ze Supabase: ' + error.message);
      console.error(error);
      return;
    }

    places = (data || []).map(row => ({
      id: row.id,
      name: row.name,
      address: row.address,
      phone: row.phone,
      email: row.email,
      website: row.website,
      types: row.types || [],
      services: row.services || [],
      openingHours: row.opening_hours || {},
      lat: row.lat,
      lng: row.lng
    }));

    renderMarkers();
  }

  async function insertPlaceToSupabase(place) {
    const { data, error } = await supabaseClient
      .from('map_places')
      .insert({
        name: place.name,
        address: place.address,
        phone: place.phone,
        email: place.email,
        website: place.website,
        types: place.types,
        services: place.services,
        opening_hours: place.openingHours,
        lat: place.lat,
        lng: place.lng
      })
      .select()
      .single();

    if (error) {
      throw error;
    }

    return {
      id: data.id,
      name: data.name,
      address: data.address,
      phone: data.phone,
      email: data.email,
      website: data.website,
      types: data.types || [],
      services: data.services || [],
      openingHours: data.opening_hours || {},
      lat: data.lat,
      lng: data.lng
    };
  }

    const { data, error } = await supabaseClient
      .from('map_places')
      .update({

        phone: place.phone,
        email: place.email,
        website: place.website,
        types: place.types,
        services: place.services,
        opening_hours: place.openingHours,

  function generateTimeOptions() {
    const times = [];

    for (let hour = 0; hour <= 23; hour++) {
      ['00', '30'].forEach(minutes => {
        const formattedHour = String(hour).padStart(2, '0');
        times.push(`${formattedHour}:${minutes}`);
      });
    }

    times.push('24:00');
    return times;
  }

  function fillTimeSelects() {
    const times = generateTimeOptions();

    document.querySelectorAll('.adminMapOpeningFrom, .adminMapOpeningTo').forEach(select => {
      select.innerHTML = '';

      times.forEach(time => {
        const option = document.createElement('option');
        option.value = time;
        option.textContent = time;
        select.appendChild(option);
      });
    });

    days.forEach(day => {
      const fromSelect = document.querySelector(`.adminMapOpeningFrom[data-day="${day.key}"]`);
      const toSelect = document.querySelector(`.adminMapOpeningTo[data-day="${day.key}"]`);

      fromSelect.value = '08:00';
      toSelect.value = '16:00';
    });
  }

      const fromSelect = document.querySelector(`.adminMapOpeningFrom[data-day="${day.key}"]`);
      const toSelect = document.querySelector(`.adminMapOpeningTo[data-day="${day.key}"]`);
      const closedInput = document.querySelector(`.adminMapClosedDay[data-day="${day.key}"]`);
      const phoneInput = document.querySelector(`.adminMapPhoneDay[data-day="${day.key}"]`);

      fromSelect.value = mondayFrom;
      toSelect.value = mondayTo;
      closedInput.checked = mondayClosed;
      phoneInput.checked = mondayPhone;
    });
  }

  function getOpeningHoursFromForm() {
    const openingHours = {};

    days.forEach(day => {
      openingHours[day.key] = {
        label: day.label,
        from: document.querySelector(`.adminMapOpeningFrom[data-day="${day.key}"]`).value,
        to: document.querySelector(`.adminMapOpeningTo[data-day="${day.key}"]`).value,
        closed: document.querySelector(`.adminMapClosedDay[data-day="${day.key}"]`).checked,
        phone: document.querySelector(`.adminMapPhoneDay[data-day="${day.key}"]`).checked
      };
    });

    return openingHours;
  }

  function resetOpeningHoursForm() {
    days.forEach(day => {
      document.querySelector(`.adminMapOpeningFrom[data-day="${day.key}"]`).value = '08:00';
      document.querySelector(`.adminMapOpeningTo[data-day="${day.key}"]`).value = '16:00';
      document.querySelector(`.adminMapClosedDay[data-day="${day.key}"]`).checked = false;
      document.querySelector(`.adminMapPhoneDay[data-day="${day.key}"]`).checked = false;
    });
  }

  function formatOpeningHours(openingHours) {
    if (!openingHours) return 'Neuvedeno';

    return days.map(day => {
      const item = openingHours[day.key];

      if (!item) return `${day.label}: Neuvedeno`;
      if (item.phone) return `${day.label}: Po telefonické dohodě`;
      if (item.closed) return `${day.label}: Zavřeno`;

      return `${day.label}: ${item.from}–${item.to}`;
    }).join('<br>');
  }

  function setOpeningHoursForm(openingHours) {
    days.forEach(day => {
      const item = openingHours && openingHours[day.key]
        ? openingHours[day.key]
        : { from: '08:00', to: '16:00', closed: false, phone: false };

      document.querySelector(`.adminMapOpeningFrom[data-day="${day.key}"]`).value = item.from || '08:00';
      document.querySelector(`.adminMapOpeningTo[data-day="${day.key}"]`).value = item.to || '16:00';
      document.querySelector(`.adminMapClosedDay[data-day="${day.key}"]`).checked = !!item.closed;
      document.querySelector(`.adminMapPhoneDay[data-day="${day.key}"]`).checked = !!item.phone;
    });
  }

  function startEditPlace(index) {
    const place = places[index];

    if (!place) return;

    editingPlaceIndex = index;

    document.getElementById('adminMapPlaceName').value = place.name || '';
    document.getElementById('adminMapPlaceAddress').value = place.address || '';
    document.getElementById('adminMapPlacePhone').value = place.phone || '';
    document.getElementById('adminMapPlaceEmail').value = place.email || '';
    document.getElementById('adminMapPlaceWebsite').value = place.website || '';
    document.getElementById('adminMapPlaceLat').value = place.lat || '';
    document.getElementById('adminMapPlaceLng').value = place.lng || '';

    document.querySelectorAll('.adminMapPlaceService').forEach(input => {
      input.checked = place.services && place.services.includes(input.value);
    });

    document.querySelectorAll('.adminMapPlaceType').forEach(input => {
      input.checked = place.types && place.types.includes(input.value);
    });

    setOpeningHoursForm(place.openingHours);

    updateServicesButtonText();

    document.getElementById('adminMapAddPlaceButton').textContent = 'Uložit změny bodu';
    document.getElementById('adminMapCancelEditButton').style.display = 'inline-block';

    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  }

  function cancelEditPlace() {
    editingPlaceIndex = null;

    document.getElementById('adminMapPlaceName').value = '';
    document.getElementById('adminMapPlaceAddress').value = '';
    document.getElementById('adminMapPlacePhone').value = '';
    document.getElementById('adminMapPlaceEmail').value = '';
    document.getElementById('adminMapPlaceWebsite').value = '';
    document.getElementById('adminMapPlaceLat').value = '';
    document.getElementById('adminMapPlaceLng').value = '';

    document.querySelectorAll('.adminMapPlaceType').forEach(input => input.checked = false);
    document.querySelectorAll('.adminMapPlaceService').forEach(input => input.checked = false);

    resetOpeningHoursForm();
    updateServicesButtonText();

    document.getElementById('adminMapAddPlaceButton').textContent = 'Přidat do mapy podle adresy';
    document.getElementById('adminMapCancelEditButton').style.display = 'none';
  }

  function updateServicesButtonText() {
    const selectedServices = document.querySelectorAll('.adminMapPlaceService:checked');
    const button = document.getElementById('adminMapServicesButton');

    button.textContent = selectedServices.length
      ? `Vybráno služeb: ${selectedServices.length}`
      : 'Vybrat služby';
  }

  function arraysHaveSameItems(a, b) {
    if (a.length !== b.length) return false;

    const sortedA = [...a].sort();
    const sortedB = [...b].sort();

    return sortedA.every((value, index) => value === sortedB[index]);
  }

  function getIconTypesForPlace(place, activeFilters) {
    if (!activeFilters.length) {
      return place.types;
    }

    const matchingTypes = place.types.filter(type => activeFilters.includes(type));

    if (matchingTypes.length === 3) {
      return ['vzorkovna', 'vydejni_misto', 'prodejce'];
    }

    return matchingTypes;
  }

  function shouldShowPlace(place, activeFilters) {
    if (!activeFilters.length) {
      return true;
    }

    return place.types.some(type => activeFilters.includes(type));
  }



  function exportMapHtmlToClipboard() {
    const iframeCode = `<iframe
  src="https://brambor2cz-droid.github.io/mapa-wpc/"
  width="100%"
  height="700"
  style="border:0; width:100%; min-height:700px;"
  loading="lazy">
</iframe>`;

    navigator.clipboard.writeText(iframeCode)
      .then(() => alert('Iframe kód pro Webnode byl zkopírován do schránky.'))
      .catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = iframeCode;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('Iframe kód pro Webnode byl zkopírován do schránky.');
      });
  }

  function renderMarkers() {
    markers.forEach(marker => map.removeLayer(marker));
    markers = [];
    markerByPlaceIndex = {};

    const activeFilters = Array.from(document.querySelectorAll('.adminMapFilter:checked'))
      .map(input => input.value);

    places.forEach((place, index) => {
      if (!shouldShowPlace(place, activeFilters)) return;

      const iconTypes = getIconTypesForPlace(place, activeFilters);

      const marker = L.marker([place.lat, place.lng], {
        icon: getMarkerIcon(iconTypes)
      }).addTo(map);

      marker.on('click', function() {
        openPlaceModal(index);
      });

      markers.push(marker);
      markerByPlaceIndex[index] = marker;
    });
  }

  function enableMapClickSelection() {
    waitingForMapClick = true;
    alert('Klikni do mapy na místo, kam chceš bod umístit.');
  }

  map.on('click', function(event) {
    if (!waitingForMapClick) return;

    document.getElementById('adminMapPlaceLat').value = event.latlng.lat.toFixed(6);
    document.getElementById('adminMapPlaceLng').value = event.latlng.lng.toFixed(6);

    waitingForMapClick = false;

    alert('Souřadnice byly vyplněny do formuláře.');
  });

  function openPlaceModal(index) {
    const place = places[index];

    if (!place) return;

    const modal = document.getElementById('adminMapPlaceModal');
    const title = document.getElementById('adminMapModalTitle');
    const body = document.getElementById('adminMapModalBody');
    const editButton = document.getElementById('adminMapModalEditButton');

    title.textContent = place.name || 'Detail bodu';

    body.innerHTML = `
      <div class="admin-map-modal-section">
        <strong>Adresa:</strong>
        ${place.address || 'Neuvedeno'}
      </div>

      <div class="admin-map-modal-section">
        <strong>Telefon:</strong>
        ${place.phone || 'Neuvedeno'}
      </div>

      <div class="admin-map-modal-section">
        <strong>E-mail:</strong>
        ${place.email || 'Neuvedeno'}
      </div>

      <div class="admin-map-modal-section">
        <strong>Web partnera:</strong>
        ${
          place.website
            ? `<a href="${place.website}" target="_blank" rel="noopener noreferrer">${place.website}</a>`
            : 'Neuvedeno'
        }
      </div>

      <div class="admin-map-modal-section">
        <strong>Typ bodu:</strong>
        ${place.types && place.types.length ? place.types.map(getTypeLabel).join(', ') : 'Neuvedeno'}
      </div>

      <div class="admin-map-modal-section">
        <strong>Služby:</strong>
        ${place.services && place.services.length ? place.services.join('<br>') : 'Neuvedeno'}
      </div>

      <div class="admin-map-modal-section">
        <strong>Otevírací doba:</strong>
        ${formatOpeningHours(place.openingHours)}
      </div>
    `;

    editButton.onclick = function() {
      closePlaceModal();
      startEditPlace(index);
    };

    modal.classList.add('open');
  }

  function closePlaceModal() {
    document.getElementById('adminMapPlaceModal').classList.remove('open');
  }

  function normalizeSearchText(value) {
    return value
      .toString()
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .trim();
  }

  function getMatchingPlacesByName(query) {
    const normalizedQuery = normalizeSearchText(query);

    if (!normalizedQuery) return [];

    return places
      .map((place, index) => ({ place, index }))
      .filter(item => normalizeSearchText(item.place.name).includes(normalizedQuery));
  }

  function showSearchResults() {
    const input = document.getElementById('adminMapSearchInput');
    const resultsBox = document.getElementById('adminMapSearchResults');
    const matches = getMatchingPlacesByName(input.value);

    resultsBox.innerHTML = '';

    if (!input.value.trim() || !matches.length) {
      resultsBox.style.display = 'none';
      return;
    }

    matches.forEach(item => {
      const div = document.createElement('div');
      div.className = 'search-result-item';
      div.textContent = item.place.name + ' — ' + item.place.address;
      div.addEventListener('click', function() {
        focusPlaceOnMap(item.index);
        resultsBox.style.display = 'none';
      });

      resultsBox.appendChild(div);
    });

    resultsBox.style.display = 'block';
  }

  function focusPlaceOnMap(index) {
    const place = places[index];

    if (!place) {
      alert('Bod nebyl nalezen.');
      return;
    }

    const marker = markerByPlaceIndex[index];

    if (!marker) {
      alert('Bod existuje, ale není aktuálně viditelný kvůli filtrům. Vypni filtry nebo zaškrtni odpovídající typ bodu.');
      return;
    }

    map.setView([place.lat, place.lng], 14);
    openPlaceModal(index);
  }

  function searchPlaceByName() {
    const input = document.getElementById('adminMapSearchInput');
    const matches = getMatchingPlacesByName(input.value);

    if (!input.value.trim()) {
      alert('Zadej název bodu.');
      return;
    }

    if (!matches.length) {
      alert('Bod s tímto názvem nebyl nalezen.');
      return;
    }

    focusPlaceOnMap(matches[0].index);
    document.getElementById('adminMapSearchResults').style.display = 'none';
  }

  async function addPlaceByAddress() {
    const nameInput = document.getElementById('adminMapPlaceName');
    const addressInput = document.getElementById('adminMapPlaceAddress');
    const latInput = document.getElementById('adminMapPlaceLat');
    const lngInput = document.getElementById('adminMapPlaceLng');

    const name = nameInput.value.trim();
    const address = addressInput.value.trim();

    const phone = document.getElementById('adminMapPlacePhone').value.trim();
    const email = document.getElementById('adminMapPlaceEmail').value.trim();
    let website = document.getElementById('adminMapPlaceWebsite').value.trim();

    if (website && !website.startsWith('http://') && !website.startsWith('https://')) {
      website = 'https://' + website;
    }
    const manualLat = parseFloat(latInput.value.replace(',', '.'));
    const manualLng = parseFloat(lngInput.value.replace(',', '.'));

    const types = Array.from(document.querySelectorAll('.adminMapPlaceType:checked'))
      .map(input => input.value);

    const services = Array.from(document.querySelectorAll('.adminMapPlaceService:checked'))
      .map(input => input.value);

    const openingHours = getOpeningHoursFromForm();

    if (!name) {
      alert('Vyplň název místa.');
      return;
    }

    if (!address) {
      alert('Vyplň adresu místa.');
      return;
    }

    if (!services.length) {
      alert('Vyber alespoň jednu službu.');
      return;
    }

    if (!types.length) {
      alert('Vyber alespoň jeden typ místa.');
      return;
    }

    const originalPlace = editingPlaceIndex !== null ? places[editingPlaceIndex] : null;
    const normalizedAddress = address.toLowerCase().trim();
    const originalNormalizedAddress = originalPlace && originalPlace.address
      ? originalPlace.address.toLowerCase().trim()
      : '';

    const addressWasChanged = !originalPlace || normalizedAddress !== originalNormalizedAddress;
    const manualGpsIsFilled = !Number.isNaN(manualLat) && !Number.isNaN(manualLng);

    async function findCoordinatesByAddress(addressToFind) {
      const searchAddress = addressToFind.toLowerCase().includes('česká republika')
        ? addressToFind
        : `${addressToFind}, Česká republika`;

      const errors = [];

      async function tryNominatim() {
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=cz&addressdetails=1&q=${encodeURIComponent(searchAddress)}`;

        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`Nominatim chyba: ${response.status}`);
        }

        const data = await response.json();

        if (!data.length) {
          throw new Error('Nominatim adresu nenašel.');
        }

        return {
          address: searchAddress,
          lat: parseFloat(data[0].lat),
          lng: parseFloat(data[0].lon)
        };
      }

      async function tryPhoton() {
        const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(searchAddress)}&limit=1&lang=cs`;

        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`Photon chyba: ${response.status}`);
        }

        const data = await response.json();

        if (!data.features || !data.features.length) {
          throw new Error('Photon adresu nenašel.');
        }

        const coordinates = data.features[0].geometry.coordinates;

        return {
          address: searchAddress,
          lat: parseFloat(coordinates[1]),
          lng: parseFloat(coordinates[0])
        };
      }

      try {
        return await tryNominatim();
      } catch (error) {
        errors.push(error.message);
      }

      try {
        return await tryPhoton();
      } catch (error) {
        errors.push(error.message);
      }

      throw new Error(
        'Automatické hledání adresy selhalo. Použij tlačítko „Vybrat bod kliknutím do mapy“ nebo vyplň GPS souřadnice ručně.'
      );
    }

    try {
      let finalAddress = address;
      let lat = originalPlace ? originalPlace.lat : null;
      let lng = originalPlace ? originalPlace.lng : null;

      if (manualGpsIsFilled) {
        lat = manualLat;
        lng = manualLng;
      } else if (addressWasChanged) {
        try {
          const foundLocation = await findCoordinatesByAddress(address);

          finalAddress = foundLocation.address;
          lat = foundLocation.lat;
          lng = foundLocation.lng;
        } catch (geoError) {
          if (originalPlace) {
            finalAddress = address;
            alert('Automatické hledání adresy selhalo, ale úpravy bodu byly uloženy na původních souřadnicích.');
          } else {
            alert(geoError.message);
            console.error(geoError);
            return;
          }
        }
      }

      if (lat === null || lng === null || Number.isNaN(lat) || Number.isNaN(lng)) {
        alert('Nepodařilo se získat souřadnice. Klikni na „Vybrat bod kliknutím do mapy“ nebo vyplň GPS šířku a délku ručně.');
        return;
      }

      const updatedPlace = {
        id: originalPlace ? originalPlace.id : null,
        name,
        address: finalAddress,
        phone,
        email,
        website,
        types,
        services,
        openingHours,
        lat,
        lng
      };

      let savedPlace;

      if (editingPlaceIndex !== null && updatedPlace.id) {
        savedPlace = await updatePlaceInSupabase(updatedPlace);
        places[editingPlaceIndex] = savedPlace;
      } else {
        savedPlace = await insertPlaceToSupabase(updatedPlace);
        places.push(savedPlace);
      }

      renderMarkers();
      map.setView([savedPlace.lat, savedPlace.lng], 13);

      cancelEditPlace();

    } catch (error) {
      alert('Nepodařilo se uložit bod do Supabase: ' + (error.message || 'Neznámá chyba.'));
      console.error(error);
    }
  }

  fillTimeSelects();

  document.getElementById('adminMapModalCloseButton').addEventListener('click', closePlaceModal);

  document.getElementById('adminMapModalCloseFooterButton').addEventListener('click', closePlaceModal);

  document.getElementById('adminMapPlaceModal').addEventListener('click', function(event) {
    if (event.target === this) {
      closePlaceModal();
    }
  });

  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      closePlaceModal();
    }
  });

  document.getElementById('adminMapSearchButton').addEventListener('click', searchPlaceByName);

  document.getElementById('adminMapSearchInput').addEventListener('input', showSearchResults);

  document.getElementById('adminMapSearchInput').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
      searchPlaceByName();
    }
  });

  document.addEventListener('click', function(event) {
    const searchBox = document.querySelector('.map-search');

    if (!searchBox.contains(event.target)) {
      document.getElementById('adminMapSearchResults').style.display = 'none';
    }
  });

  document.getElementById('adminMapExportHtmlButton').addEventListener('click', exportMapHtmlToClipboard);

  document.getElementById('adminMapAddPlaceButton').addEventListener('click', addPlaceByAddress);

  document.getElementById('adminMapUseMapClickButton').addEventListener('click', enableMapClickSelection);

  document.getElementById('adminMapCancelEditButton').addEventListener('click', cancelEditPlace);

  document.getElementById('adminMapCopyMondayButton').addEventListener('click', copyMondayOpeningHours);

  document.querySelectorAll('.adminMapFilter').forEach(input => {
    input.addEventListener('change', renderMarkers);
  });

  document.querySelectorAll('.adminMapPlaceService').forEach(input => {
    input.addEventListener('change', updateServicesButtonText);
  });

  document.getElementById('adminMapServicesButton').addEventListener('click', function(event) {
    event.stopPropagation();
    document.getElementById('adminMapServicesDropdown').classList.toggle('open');
  });

  document.addEventListener('click', function(event) {
    const dropdown = document.getElementById('adminMapServicesDropdown');

    if (!dropdown.contains(event.target)) {
      dropdown.classList.remove('open');
    }
  });

  loadPlacesFromSupabase();
</script>
