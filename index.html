<script>
  const map = L.map('adminMap').setView([49.8175, 15.4730], 7);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  function getMarkerIcon(types) {
    const sortedTypes = [...types].sort();

    if (sortedTypes.length === 1 && sortedTypes.includes('prodejce')) {
      return L.divIcon({
        html: '<div class="partner-image-marker"></div>',
        className: '',
        iconSize: [58, 70],
        iconAnchor: [29, 70],
        popupAnchor: [0, -70]
      });
    }

    let pinClass = 'pin-all-types';
    let icons = [];

    if (sortedTypes.length === 1 && sortedTypes.includes('vzorkovna')) {
      pinClass = 'pin-vzorkovna';
      icons = ['🏪'];
    } else if (sortedTypes.length === 1 && sortedTypes.includes('vydejni_misto')) {
      pinClass = 'pin-vydejni_misto';
      icons = ['📦'];
    } else if (sortedTypes.includes('vzorkovna') && sortedTypes.includes('vydejni_misto') && sortedTypes.length === 2) {
      pinClass = 'pin-vzorkovna-vydejni_misto';
      icons = ['🏪', '📦'];
    } else if (sortedTypes.includes('vzorkovna') && sortedTypes.includes('prodejce') && sortedTypes.length === 2) {
      pinClass = 'pin-vzorkovna-prodejce';
      icons = ['🏪', '👤'];

  function arraysHaveSameItems(a, b) {
    if (a.length !== b.length) return false;

    const sortedA = [...a].sort();
    const sortedB = [...b].sort();

    return sortedA.every((value, index) => value === sortedB[index]);
  }

  async function addPlaceByAddress() {
    const nameInput = document.getElementById('adminMapPlaceName');
    const addressInput = document.getElementById('adminMapPlaceAddress');
    const latInput = document.getElementById('adminMapPlaceLat');
    const lngInput = document.getElementById('adminMapPlaceLng');

    const name = nameInput.value.trim();
    const address = addressInput.value.trim();

    const phone = document.getElementById('adminMapPlacePhone').value.trim();
    const email = document.getElementById('adminMapPlaceEmail').value.trim();
    let website = document.getElementById('adminMapPlaceWebsite').value.trim();

    if (website && !website.startsWith('http://') && !website.startsWith('https://')) {
      website = 'https://' + website;
    }
    const manualLat = parseFloat(latInput.value.replace(',', '.'));
    const manualLng = parseFloat(lngInput.value.replace(',', '.'));

    const types = Array.from(document.querySelectorAll('.adminMapPlaceType:checked'))
      .map(input => input.value);

    const services = Array.from(document.querySelectorAll('.adminMapPlaceService:checked'))
      .map(input => input.value);

    const openingHours = getOpeningHoursFromForm();

    if (!name) {
      alert('Vyplň název místa.');
      return;
    }

    if (!address) {
      alert('Vyplň adresu místa.');
      return;
    }

    if (!services.length) {
      alert('Vyber alespoň jednu službu.');
      return;
    }

    if (!types.length) {
      alert('Vyber alespoň jeden typ místa.');
      return;
    }

    const originalPlace = editingPlaceIndex !== null ? places[editingPlaceIndex] : null;
    const normalizedAddress = address.toLowerCase().trim();
    const originalNormalizedAddress = originalPlace && originalPlace.address
      ? originalPlace.address.toLowerCase().trim()
      : '';

    const addressWasChanged = !originalPlace || normalizedAddress !== originalNormalizedAddress;
    const manualGpsIsFilled = !Number.isNaN(manualLat) && !Number.isNaN(manualLng);

    async function findCoordinatesByAddress(addressToFind) {
      const searchAddress = addressToFind.toLowerCase().includes('česká republika')
        ? addressToFind
        : `${addressToFind}, Česká republika`;

      const errors = [];

      async function tryNominatim() {
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=cz&addressdetails=1&q=${encodeURIComponent(searchAddress)}`;

        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`Nominatim chyba: ${response.status}`);
        }

        const data = await response.json();

        if (!data.length) {
          throw new Error('Nominatim adresu nenašel.');
        }

        return {
          address: searchAddress,
          lat: parseFloat(data[0].lat),
          lng: parseFloat(data[0].lon)
        };
      }

      async function tryPhoton() {
        const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(searchAddress)}&limit=1&lang=cs`;

        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`Photon chyba: ${response.status}`);
        }

        const data = await response.json();

        if (!data.features || !data.features.length) {
          throw new Error('Photon adresu nenašel.');
        }

        const coordinates = data.features[0].geometry.coordinates;

        return {
          address: searchAddress,
          lat: parseFloat(coordinates[1]),
          lng: parseFloat(coordinates[0])
        };
      }

      try {
        return await tryNominatim();
      } catch (error) {
        errors.push(error.message);
      }

      try {
        return await tryPhoton();
      } catch (error) {
        errors.push(error.message);
      }

      throw new Error(
        'Automatické hledání adresy selhalo. Použij tlačítko „Vybrat bod kliknutím do mapy“ nebo vyplň GPS souřadnice ručně.'
      );
    }

    try {
      let finalAddress = address;
      let lat = originalPlace ? originalPlace.lat : null;
      let lng = originalPlace ? originalPlace.lng : null;

      if (manualGpsIsFilled) {
        lat = manualLat;
        lng = manualLng;
      } else if (addressWasChanged) {
        try {
          const foundLocation = await findCoordinatesByAddress(address);

          finalAddress = foundLocation.address;
          lat = foundLocation.lat;
          lng = foundLocation.lng;
        } catch (geoError) {
          if (originalPlace) {
            finalAddress = address;
            alert('Automatické hledání adresy selhalo, ale úpravy bodu byly uloženy na původních souřadnicích.');
          } else {
            alert(geoError.message);
            console.error(geoError);
            return;
          }
        }
      }

      if (lat === null || lng === null || Number.isNaN(lat) || Number.isNaN(lng)) {
        alert('Nepodařilo se získat souřadnice. Klikni na „Vybrat bod kliknutím do mapy“ nebo vyplň GPS šířku a délku ručně.');
        return;
      }

      const updatedPlace = {
        id: originalPlace ? originalPlace.id : null,
        name,
        address: finalAddress,
        phone,
        email,
        website,
        types,
        services,
        openingHours,
        lat,
        lng
      };

      let savedPlace;

      if (editingPlaceIndex !== null && updatedPlace.id) {
        savedPlace = await updatePlaceInSupabase(updatedPlace);
        places[editingPlaceIndex] = savedPlace;
      } else {
        savedPlace = await insertPlaceToSupabase(updatedPlace);
        places.push(savedPlace);
      }

      renderMarkers();
      map.setView([savedPlace.lat, savedPlace.lng], 13);

      cancelEditPlace();

    } catch (error) {
      alert('Nepodařilo se uložit bod do Supabase: ' + (error.message || 'Neznámá chyba.'));
      console.error(error);
    }
  }

  document.getElementById('adminMapSearchButton').addEventListener('click', searchPlaceByName);

  document.getElementById('adminMapSearchInput').addEventListener('input', showSearchResults);

  document.getElementById('adminMapSearchInput').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
      searchPlaceByName();
    }
  });

  document.addEventListener('click', function(event) {
    const searchBox = document.querySelector('.map-search');

    if (!searchBox.contains(event.target)) {
      document.getElementById('adminMapSearchResults').style.display = 'none';
    }
  });

  document.getElementById('adminMapExportHtmlButton').addEventListener('click', exportMapHtmlToClipboard);

  document.getElementById('adminMapAddPlaceButton').addEventListener('click', addPlaceByAddress);

  document.getElementById('adminMapUseMapClickButton').addEventListener('click', enableMapClickSelection);

  document.getElementById('adminMapCancelEditButton').addEventListener('click', cancelEditPlace);

  document.getElementById('adminMapCopyMondayButton').addEventListener('click', copyMondayOpeningHours);

  document.querySelectorAll('.adminMapFilter').forEach(input => {
    input.addEventListener('change', renderMarkers);
  });

  document.querySelectorAll('.adminMapPlaceService').forEach(input => {
    input.addEventListener('change', updateServicesButtonText);
  });

  document.getElementById('adminMapServicesButton').addEventListener('click', function(event) {
    event.stopPropagation();
    document.getElementById('adminMapServicesDropdown').classList.toggle('open');
  });

  document.addEventListener('click', function(event) {
    const dropdown = document.getElementById('adminMapServicesDropdown');

    if (!dropdown.contains(event.target)) {
      dropdown.classList.remove('open');
    }
  });

  loadPlacesFromSupabase();
</script>
